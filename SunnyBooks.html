	<style>
		:root {
			/* ==== Blätter-Effekt (Page-Flip): einstellbare Stil-Parameter ==== */
			--flip-duration: 1200ms;                              /* Dauer der Blätter-Animation (Sync mit JS: FLIP_DURATION_MS) */
			--flip-easing: cubic-bezier(0.45, 0.05, 0.15, 1);     /* Bewegungskurve der Blätter-Animation */
			--flip-perspective: 1800px;                           /* 3D-Tiefe; kleiner = staerker gewoelbt/dramatischer */
			--flip-page-bg: #fdfdfa;                              /* Papierfarbe der umblaetternden Seite */
			--flip-shadow-color: rgba(20, 15, 10, 0.45);          /* Farbe/Intensitaet des Falz-/Wende-Schattens */
			--flip-shadow-width: 42%;                             /* Breite des Schattenverlaufs an der Wendekante */
			--flip-drop-shadow: 0 10px 26px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.25); /* "Abhebe"-Schatten der Seite */

			/* ==== Build-Parameter (nicht von CSS genutzt, nur von tools/build.js ausgelesen) ==== */
			--build-webp-quality: 75;                             /* WebP-Kompressionsqualitaet 0-100 fuer Hintergrundbilder */
		}
		*, *::before, *::after { box-sizing: border-box; }

		html, body { height: 100%; height: 100dvh; width: 100%; margin: 0; padding: 0; overflow: hidden; display: flex; flex-direction: column; font-family: jpsym, sans-serif; }
		#bg-container { position: fixed; top:0; left:0; width:100%; height:100%; height:100dvh; z-index: -1; background-size: cover; background-position: center; transition: opacity 3s ease-in-out; }

		header {
			flex: 0 0 auto; width: 100%; background: transparent;
			display: flex; flex-direction: column;
		}
		.header-wrapper {
			width: 100%; display: flex; align-items: center; padding: 0.2rem 16px; height: 33px;
		}
		/* Kopfzeilen-Schrift (Buchname - Seite x/y): per CSS erzwungen, damit auch gespeicherte Entwuerfe und geladene Buecher mit altem Inline-Wert (0.55rem) mitwachsen */
		.header-wrapper > div { font-size: 0.69rem !important; }
		/* Tooltip-Einblendung (Langdruck auf Touch-Geraeten) */
		#jp-tip { position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%); z-index: 800; background: rgba(0,0,0,0.88); color: #fff; padding: 7px 14px; border-radius: 6px; font-size: 0.9rem; line-height: 1.3; max-width: 90vw; text-align: center; opacity: 0; transition: opacity 0.2s ease; pointer-events: none; }
		#jp-tip.jp-show { opacity: 1; }
		.logo-img {
			flex-shrink: 0; width: 45px; height: 28px; object-fit: contain; margin-right: 10px;
		}
		.page-title {
			font-size: 0.875rem; font-weight: bold; text-transform: uppercase; text-align: center; width: 100%; padding-bottom: 0.25rem; margin-top: -2px;
		}

		main {
			flex: 1; overflow-y: scroll; font-size: 0.9rem; line-height: 1.4; width: 100%; padding: 0.3rem 16px calc(1rem + 12px); scrollbar-gutter: stable; touch-action: pan-y; 
		}
		main::-webkit-scrollbar { width: 10px; }
		main::-webkit-scrollbar-thumb { background: rgba(120,120,120,0.5); border-radius: 5px; }
		main::-webkit-scrollbar-track { background: rgba(180,180,180,0.15); }

		.page { display: none; }
		.page.active { display: block; }
		.columns { column-count: 1; }
		.columns p { margin: 0 0 0.9em 0; }
		.columns p:last-child { margin-bottom: 0; }
		.columns p:has(> strong:only-child) { margin: 1.1em 0 0.3em 0; }
		.columns p:has(> strong:only-child):first-child { margin-top: 0; }
		.columns ul { margin: 0 0 0.9em 0; }
		.columns ul:last-child { margin-bottom: 0; }
		.columns ul { list-style-type: disc; padding-left: 12px; text-align: left; }
		/* Gruen: EINE Quelle fuer Hyperlinks und die Farbfunktion "Gruen" (jp-c3). Muss zur Palette im JS passen (cls 'jp-c3'). */
		:root { --jp-green: #2e7d32; }
		body.dark-mode { --jp-green: #6fdc74; }
		.columns a.jp-link, .columns a { font-weight: bold; color: var(--jp-green); }
		.columns a.jp-sym-link { text-decoration: none; }
		.columns p.jp-title { text-align: center; font-size: 200%; }
		/* ==== Buchformate: nummerierte Liste, Ueberschriften, Zitat, Ausrichtung, Linie, Groessen, Bilder ==== */
		.columns ol { margin: 0 0 0.9em 0; list-style-type: decimal; padding-left: 20px; text-align: left; }
		.columns ol:last-child { margin-bottom: 0; }
		.columns p.jp-h1 { font-size: 1.6em; font-weight: bold; margin: 1.1em 0 0.4em 0; }
		.columns p.jp-h2 { font-size: 1.25em; font-weight: bold; margin: 1.1em 0 0.3em 0; }
		.columns p.jp-h1:first-child, .columns p.jp-h2:first-child { margin-top: 0; }
		/* ==== Karten (jp-card) und Symbole (jp-sym) ==== */
		.columns .jp-card { --jp-k: var(--jp-green); position: relative; margin: 0 0 0.9em 0; padding: 0.8em 0.9em; border: 1px solid color-mix(in srgb, var(--jp-k) 42%, transparent); border-radius: 0.9em; background: color-mix(in srgb, var(--jp-k) 11%, transparent); break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; text-align: left; }
		.columns .jp-card.jp-k1 { --jp-k: var(--jp-green); }
		.columns .jp-card.jp-k2 { --jp-k: #1565c0; }
		.columns .jp-card.jp-k3 { --jp-k: #e65100; }
		.columns .jp-card.jp-k4 { --jp-k: #6a1b9a; }
		.columns .jp-card.jp-k5 { --jp-k: #c62828; }
		.columns .jp-card.jp-k6 { --jp-k: #757575; }
		body.dark-mode .columns .jp-card.jp-k2 { --jp-k: #64b5f6; }
		body.dark-mode .columns .jp-card.jp-k3 { --jp-k: #ffa040; }
		body.dark-mode .columns .jp-card.jp-k4 { --jp-k: #c58af0; }
		body.dark-mode .columns .jp-card.jp-k5 { --jp-k: #ff6b6b; }
		body.dark-mode .columns .jp-card.jp-k6 { --jp-k: #b0b0b0; }
		.columns .jp-card > * { margin-top: 0; margin-bottom: 0.5em; }
		.columns .jp-card > :last-child { margin-bottom: 0; }
		.columns .jp-card > p:first-child { font-weight: bold; font-size: 1.1em; }
		.columns .jp-card[data-i] > p:first-child { min-height: 2em; padding: 0.3em 0 0 2.55em; }
		.columns .jp-card[data-i]::before { content: ""; position: absolute; left: 0.9em; top: 0.8em; width: 2.2em; height: 2.2em; border-radius: 0.65em; background: color-mix(in srgb, var(--jp-k) 24%, transparent); pointer-events: none; }
		.columns .jp-card[data-i]::after { content: ""; position: absolute; left: 1.35em; top: 1.25em; width: 1.3em; height: 1.3em; background: var(--jp-k); -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; pointer-events: none; }
		.jp-sym { display: inline-block; width: 1.2em; height: 1.2em; vertical-align: -0.22em; background: currentColor; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
		.columns .jp-al-c { text-align: center; }
		.columns .jp-al-r { text-align: right; }
		.columns .jp-al-j { text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
		.columns hr { border: none; border-top: 1px solid rgba(128,128,128,0.6); margin: 0.9em 0; }
		.columns .jp-zm2 { font-size: 0.75em; }
		.columns .jp-zm1 { font-size: 0.88em; }
		.columns .jp-z1 { font-size: 1.2em; }
		.columns .jp-z2 { font-size: 1.5em; }
		.columns .jp-z3 { font-size: 2em; }
		.columns .jp-c1 { color: #c62828; }
		.columns .jp-c2 { color: #e65100; }
		.columns .jp-c3 { color: var(--jp-green); }
		.columns .jp-c4 { color: #1565c0; }
		.columns .jp-c5 { color: #6a1b9a; }
		.columns .jp-c6 { color: #757575; }
		body.dark-mode .columns .jp-c1 { color: #ff6b6b; }
		body.dark-mode .columns .jp-c2 { color: #ffa040; }
		body.dark-mode .columns .jp-c3 { color: var(--jp-green); }
		body.dark-mode .columns .jp-c4 { color: #64b5f6; }
		body.dark-mode .columns .jp-c5 { color: #c58af0; }
		body.dark-mode .columns .jp-c6 { color: #b0b0b0; }
		.columns img { max-width: 100%; height: auto; vertical-align: middle; }
		.columns img.jp-w25 { width: 25%; }
		.columns img.jp-w50 { width: 50%; }
		.columns img.jp-w75 { width: 75%; }
		.columns img.jp-w100 { width: 100%; }

		.slide-table { width: 100%; max-width: 100%; table-layout: fixed; border-collapse: collapse; }
		.slide-table td, .slide-table th { word-wrap: break-word; overflow-wrap: break-word; padding: 3px 4px; vertical-align: top; }

		footer {
			position: fixed; left: 0; bottom: 0; z-index: 450;
			height: 36px; width: 100%;
			background: transparent;
			display: flex; justify-content: center; align-items: center; gap: 1.5rem;
		}
		footer button { width: 33px; height: 33px; box-sizing: border-box; font-size: 20px; cursor: pointer; background: transparent; border: none; padding: 0; display: flex; align-items: center; justify-content: center; color: inherit; }
		#fsBtn { font-weight: bold; font-size: 1.575em; -webkit-text-stroke: 0.6px currentColor; }

		/* ==== Seitensprung per Long-Press auf Vor-/Zurück-Buttons ==== */
		.jp-nav-btn { position: relative; overflow: hidden; touch-action: manipulation; }
		.jp-nav-btn.jp-longpress-active::after {
			content: ""; position: absolute; inset: 0;
			background: rgba(128,128,128,0.35);
			transform-origin: left; transform: scaleX(0);
			animation: jp-fill 500ms linear forwards;
		}
		@keyframes jp-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
		.jp-page-jump-overlay {
			position: fixed; inset: 0; z-index: 500;
			background: rgba(0,0,0,0.5);
			display: flex; align-items: center; justify-content: center;
		}
		.jp-page-jump-overlay[hidden] { display: none; }
		.jp-page-jump-overlay input {
			font-size: 2rem; width: 4em; text-align: center;
			border: none; border-radius: 6px; padding: 0.2em 0;
		}

		/* ==== Dark Mode ==== */
		body.dark-mode { background: #121212; color: #e8e8e8; }
		body.dark-mode header { background: transparent; }
		body.dark-mode footer { background: transparent; color: #e8e8e8; }
		body.dark-mode main { color: #e8e8e8; }
		body.dark-mode .slide-table td, body.dark-mode .slide-table th { border-color: #666 !important; }
		body.dark-mode main::-webkit-scrollbar-thumb { background: rgba(160,160,160,0.5); }
		body.dark-mode main::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
		#langBtn { width: 33px; height: 33px; line-height: 1; font-size: 1rem; text-align: center; padding: 0 !important; font-weight: bold; border-radius: 6px; }

		/* ==== Blätter-Effekt (Page-Flip) ==== */
		#flip-overlay {
			position: fixed; z-index: 400; pointer-events: none;
			perspective: var(--flip-perspective);
			display: none;
		}
		#flip-overlay.active { display: block; }
		.flip-leaf {
			position: absolute; top: 0; left: 0; width: 100%; height: 100%;
			background: var(--flip-page-bg);
			backface-visibility: hidden; -webkit-backface-visibility: hidden;
			transform-style: preserve-3d;
			transform: rotateY(0deg);
			transition: transform var(--flip-duration) var(--flip-easing);
			overflow: hidden;
		}
		.flip-leaf.leaf-next { transform-origin: left center; }
		.flip-leaf.leaf-prev { transform-origin: right center; }
		.flip-leaf.flip-run.leaf-next { transform: rotateY(-180deg); box-shadow: var(--flip-drop-shadow); }
		.flip-leaf.flip-run.leaf-prev { transform: rotateY(180deg); box-shadow: var(--flip-drop-shadow); }
		/* Header wird mit auf das Blatt genommen, damit Titel/Seitenzahl wie bei einer echten Buchseite mitblaettern. */
		.flip-leaf-header {
			position: absolute; top: 0; left: 0; width: 100%;
			background: transparent; box-sizing: border-box; overflow: hidden;
		}
		.flip-leaf-header-bg {
			position: absolute; inset: 0;
			background-size: cover; background-position: center; background-repeat: no-repeat;
			pointer-events: none;
		}
		.flip-leaf-header-content { position: relative; }
		.flip-leaf-body {
			position: absolute; left: 0; width: 100%; overflow: hidden;
		}
		.flip-leaf-bg {
			position: absolute; inset: 0;
			background-size: cover; background-position: center; background-repeat: no-repeat;
			pointer-events: none;
		}
		.flip-leaf-content {
			/* overflow-y:scroll + scrollbar-gutter:stable exakt wie bei main, damit die reservierte
			   Scrollbar-Breite identisch ist und der Text exakt gleich umbricht (keine eigene, sichtbare
			   Scrollbar noetig, da hier ohnehin nicht gescrollt wird - nur fuer identisches Box-Modell). */
			position: absolute; inset: 0; overflow-y: scroll; overflow-x: hidden; scrollbar-gutter: stable; box-sizing: border-box;
			line-height: 1.4; /* einheitslos, muss mit main { line-height: ... } übereinstimmen - NICHT per JS als Pixelwert setzen, sonst skaliert es bei verschachtelten groesseren Schriftgroessen (z.B. Titelseiten mit font-size:200%) nicht mit und Zeilen/Leerzeilen ruecken zusammen */
		}
		.flip-leaf-content::-webkit-scrollbar { width: 10px; }
		.flip-leaf-content::-webkit-scrollbar-thumb { background: transparent; }
		.flip-leaf-content::-webkit-scrollbar-track { background: transparent; }
		.flip-leaf-content .columns { column-count: 1; }
		.flip-leaf-content p { margin: 0 0 0.9em 0; }
		.flip-leaf-shade {
			position: absolute; inset: 0; opacity: 0; pointer-events: none;
		}
		.leaf-next .flip-leaf-shade { background: linear-gradient(to left, var(--flip-shadow-color) 0%, transparent var(--flip-shadow-width)); }
		.leaf-prev .flip-leaf-shade { background: linear-gradient(to right, var(--flip-shadow-color) 0%, transparent var(--flip-shadow-width)); }
		.flip-leaf.flip-run .flip-leaf-shade { animation: flipShade var(--flip-duration) var(--flip-easing) forwards; }
		@keyframes flipShade { 0% { opacity: 0; } 55% { opacity: 1; } 100% { opacity: 0; } }
		@media (prefers-reduced-motion: reduce) {
			.flip-leaf { transition: none !important; }
			.flip-leaf.flip-run .flip-leaf-shade { animation: none !important; }
		}
	</style>

wechsle dann zu SunnyBooks oder nutze sofort die vielen vorgefertigten Elemente.</p></div><p><br></p><div class="jp-card jp-k4" data-i="pen"><p>Überall</p><p>Schreibe Dein Buch direkt im Browser, online auf Smartphone, Tablet oder PC, auch im Wechsel und unterwegs.</p><p>Du erhältst und sicherst Dein Buch als lokale HTML-Datei. Somit sind auch Deine Leser komplett flexibel.</p></div><p><br></p><div class="jp-card jp-k1" data-i="sparkles"><p>So sieht es aus</p><p>Bearbeite Text und Design zusammen genau so wie es aussehen soll. Bilder, Karten, Symbole, Farben, Formatierung geben den Feinschliff.</p></div><p><br></p><div class="jp-card jp-k2" data-i="code"><p>Pro</p><p>Experten schalten bei Bedarf auf HTML-Editor um und bearbeiten den Code direkt, für alles, was die Oberfläche nicht bietet.&nbsp;</p></div><p><br></p><div class="jp-card jp-k4" data-i="book"><p>Einfach smart</p><p>Dein Buch kann bereits Blättern, Zoomen, Gesten, Vorlesen, Hintergründe Ein/Aus-Blenden, Sprache Umschalten und mehr.</p></div><p><br></p><div class="jp-card jp-k3" data-i="shield"><p>Schutz</p><p>Ein kryptographischer Hashwert und ein Passwort schützen Dein Buch vor unbefugten Änderungen. </p><p>Deine Daten gebe ich nicht weiter, kein Tracking, keine Werbung stören.</p></div><p><br></p><div class="jp-card jp-k4" data-i="upload"><p>Alles Web</p><p>Kopiere Dein Buch für Andere einfach ins Netz oder teile es.&nbsp;</p><p>Bei Bedarf kann ich es auch auf meiner Site technisch hosten, aber es bleibt Deines.</p></div><p><br></p><div class="jp-card jp-k1" data-i="globe"><p>Deine Site</p><p>Gefällt Dir der Stil? Damit entstehen auch kleine, statische Websites, siehe meine:&nbsp;<a class="jp-link" href="https://iSunnyTT.github.io" target="_blank" rel="noopener noreferrer">iSunnyTT.github.io</a></p></div><p><br></p><p><strong style="text-align: center;">(C)opyright </strong><span style="text-align: center;">Bernd (Sunny) Michel</span></p><p>Die Online-Nutzung dieser Software ist gestattet. Das Herunterladen, Vervielfältigen, Verändern oder Weitergeben der Anwendung ist ohne ausdrückliche Genehmigung untersagt. SunnyBooks ist unentgeltlich nutzbar und wird ohne Gewähr, wie besehen (as is) bereitgestellt. Es besteht kein Anspruch auf Support, Fehlerbehebung oder fortlaufende Weiterentwicklung.&nbsp;</p><p><strong>Speicherung</strong></p><p>Deine Änderungen werden intern nur im nicht-permanenten Speicher gehalten. Es besteht die Gefahr dass nicht gesicherte Änderungen verlorengehen (z.B. bei Stromausfall, Browserdaten löschen, ...). Sichere die Änderungen in deinen Bücher daher regelmäßig durch Download. Aus Sicherheitsgründen speichern Browser typisch nur in fest vorgegebenen Ordnern. Von dort solltest du sie kopieren/verschieben/umbenennen je nach deinem Vorgehen. Ich zeichne keinerlei Ablage oder Aufbewahrung verantwortlich.&nbsp;</p><p><strong>Wichtiger Hinweis</strong></p><p>Mit dieser Anwendung erstellst du deine Bücher vollständig in eigener Verantwortung. Ich stelle lediglich das technische Werkzeug bereit. Sei dir bewusst, daß Schutzmaßnahmen nie absolute Sicherheit bieten.</p><p><strong>Inhalte</strong></p><p>Für deine Bücher bist du allein verantwortlich, ich prüfe Inhalte nicht und mache sie mir nicht zu eigen.</p><p><strong>Verwendung</strong></p><p>Wie du deine Bücher veröffentlichst oder verwertest, entscheidest du allein; alle damit verbundenen Pflichten und Risiken liegen bei dir.</p><p><strong>Gewährleistung</strong></p><p>Die Anwendung wird unentgeltlich und ohne Gewähr (§ 523 BGB) zur Verfügung gestellt. Eine Haftung für leichte Fahrlässigkeit ist ausgeschlossen.</p><p><strong>Spenden</strong></p><p>sind freiwillig und begründen keinerlei Anspruch auf Leistung, Verfügbarkeit oder Support.</p>

inning and reuse the smart predefined elements.</p></div><p><br></p><div class="jp-card jp-k4" data-i="pen"><p>Everywhere</p><p>Write your book right in the browser, on smartphone, tablet or PC, switching freely and on the go.</p><p>You get and save your book as local HTML file. This makes your readers flexible too.</p></div><p><br></p><div class="jp-card jp-k1" data-i="sparkles"><p>See what you get</p><p>Edit text and design right inside the real target context. Pictures, Cards, Symbols, Colors, Formatting add the finishing touch.</p></div><p><br></p><div class="jp-card jp-k2" data-i="code"><p>Pro</p><p>Experts switch to HTML and edit the code directly, for everything the interface doesn't offer.</p></div><p><br></p><div class="jp-card jp-k4" data-i="book"><p>Simple smart</p><p>Your book already contains page turning, zoom, gestures, read-aloud, background fading, language switch and more.</p></div><p><br></p><div class="jp-card jp-k3" data-i="shield"><p>Protection</p><p>A cryptographic hash and a password protect your book against unauthorized changes.&nbsp;</p><p>Your data are not forwarded, no tracking, no advertisement.</p></div><p><br></p><div class="jp-card jp-k4" data-i="upload"><p>Web</p><p>Post your book simply to the net or share it with others.</p><p>On demand, I might host it on my site technically, but its yours.</p></div><p><br></p><div class="jp-card jp-k1" data-i="globe"><p>Website Creator</p><p>Like the style? It also works for small, static websites, see <a class="jp-link" href="https://iSunnyTT.github.io" target="_blank" rel="noopener noreferrer">iSunnyTT.github.io</a></p></div><p><br></p><p><strong style="text-align: center;">(C)opyright </strong><span style="text-align: center;">Bernd (Sunny) Michel</span></p><p>​Online use of this software is permitted. Downloading, duplicating, modifying, or redistributing the application without express permission is prohibited. SunnyBooks is free to use and is provided "as is," without warranty. There is no entitlement to support, bug fixes, or ongoing development.</p><p><strong>Storage</strong></p><p>Your changes are held internally only in non-permanent storage. There is a risk that unsaved changes could be lost (e.g., due to a power outage, clearing browser data, etc.). Therefore, please save the changes to your books regularly by downloading them. For security reasons, browsers typically save files only to specific, predefined folders. You should copy, move, or rename them from there, depending on your workflow. I assume no responsibility for file storage or retention.</p><p><strong>​Important Note</strong></p><p>​You create your books using this application entirely at your own responsibility. I merely provide the technical tool. Be aware that protection doesn't mean absolute security.</p><p>​<strong>Content</strong></p><p>​You are solely responsible for the content of your books; I do not review contents nor do I adopt them as my own.</p><p>​<strong>Usage</strong></p><p>​You alone decide how to publish or utilize your books; all associated obligations and risks rest entirely with you.</p><p>​<strong>Warranty</strong></p><p>​The application is provided free of charge and without warranty (§ 523 BGB / German Civil Code). Liability for slight negligence is excluded.</p><p>​<strong>Donations</strong></p><p>​Donations are voluntary and do not establish any claim to performance, availability, or support.</p><p><br></p>
